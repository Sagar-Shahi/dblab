<svg xmlns="http://www.w3.org/2000/svg" width="940" height="428" viewBox="0 0 940 428" role="img" aria-label="DBLab SQL shell: create a table, insert rows, run a query, and see a duplicate primary key rejected">
<rect width="940" height="428" rx="10" fill="#0d1117"/><rect width="940" height="32" rx="10" fill="#161b22"/><rect y="22" width="940" height="10" fill="#161b22"/>
<circle cx="20" cy="16" r="6" fill="#ff5f56"/><circle cx="40" cy="16" r="6" fill="#ffbd2e"/><circle cx="60" cy="16" r="6" fill="#27c93f"/>
<text x="470" y="21" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" text-anchor="middle">dblab</text>
<text x="22" y="58" fill="#7ee787" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" xml:space="preserve">$ python -m dblab</text>
<text x="22" y="78" fill="#79c0ff" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" xml:space="preserve">dblab&gt; CREATE TABLE books (id INT PRIMARY KEY, title TEXT, price REAL);</text>
<text x="22" y="98" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" xml:space="preserve">ok (0 rows affected)</text>
<text x="22" y="118" fill="#79c0ff" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" xml:space="preserve">dblab&gt; INSERT INTO books VALUES (1, &#x27;SQL Cookbook&#x27;, 15), (2, &#x27;Java Handbook&#x27;, 18), (3, &#x27;C++ Primer Lite&#x27;, 20);</text>
<text x="22" y="138" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" xml:space="preserve">ok (3 rows affected)</text>
<text x="22" y="158" fill="#79c0ff" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" xml:space="preserve">dblab&gt; SELECT title, price FROM books WHERE price &gt;= 18 ORDER BY price DESC;</text>
<text x="22" y="178" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" xml:space="preserve">title           | price</text>
<text x="22" y="198" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" xml:space="preserve">----------------+------</text>
<text x="22" y="218" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" xml:space="preserve">C++ Primer Lite | 20.0 </text>
<text x="22" y="238" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" xml:space="preserve">Java Handbook   | 18.0 </text>
<text x="22" y="258" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" xml:space="preserve">(2 rows)</text>
<text x="22" y="278" fill="#79c0ff" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" xml:space="preserve">dblab&gt; INSERT INTO books VALUES (2, &#x27;Dup&#x27;, 1);</text>
<text x="22" y="298" fill="#ff7b72" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" xml:space="preserve">error: duplicate primary key 2</text>
<text x="22" y="318" fill="#79c0ff" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" xml:space="preserve">dblab&gt; SELECT COUNT(*) FROM books;</text>
<text x="22" y="338" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" xml:space="preserve">count</text>
<text x="22" y="358" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" xml:space="preserve">-----</text>
<text x="22" y="378" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" xml:space="preserve">3    </text>
<text x="22" y="398" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" xml:space="preserve">(1 row)</text>
</svg>
